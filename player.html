<!DOCTYPE html>
<html>
<head>
    <title>Netflix Clone - Player</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: none;
        }

        #player-container.controls-visible {
            cursor: default;
        }

        /* YouTube iframe fills the screen */
        #yt-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            pointer-events: none; /* let our overlay handle clicks */
        }

        /* Gradient overlay — always present for readability */
        .gradient-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 140px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
            pointer-events: none;
        }

        .gradient-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            pointer-events: none;
        }

        /* Controls overlay — fades in/out */
        #controls-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #controls-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* ── Top bar ── */
        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .back-btn:hover { opacity: 1; }

        .top-right {
            display: flex;
            gap: 18px;
        }

        .top-right button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .top-right button:hover { opacity: 1; }

        /* ── Bottom controls ── */
        .player-bottom {
            padding: 0 32px 28px;
        }

        /* Progress bar */
        .progress-wrap {
            position: relative;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: height 0.15s;
        }

        .progress-wrap:hover { height: 6px; }

        .progress-fill {
            height: 100%;
            background: #e50914;
            border-radius: 2px;
            position: relative;
            pointer-events: none;
            width: 0%;
        }

        .progress-dot {
            width: 14px;
            height: 14px;
            background: #e50914;
            border-radius: 50%;
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }

        .progress-wrap:hover .progress-dot { display: block; }

        /* Controls row */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ctrl-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            transition: opacity 0.15s, transform 0.1s;
        }

        .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }

        /* Play/pause SVG icon */
        .play-btn svg { width: 36px; height: 36px; }

        /* Skip buttons */
        .skip-btn {
            position: relative;
            width: 36px;
            height: 36px;
        }

        .skip-btn svg { width: 36px; height: 36px; }

        .skip-btn .skip-num {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Volume */
        .vol-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vol-btn svg { width: 26px; height: 26px; }

        .vol-slider {
            -webkit-appearance: none;
            width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.35);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: width 0.2s;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        .time-label {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            white-space: nowrap;
            margin-left: 4px;
        }

        .ctrl-center {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.2px;
            text-align: center;
            flex: 1;
            padding: 0 20px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .ctrl-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ctrl-right svg { width: 24px; height: 24px; }
    </style>
</head>
<body>

<div id="player-container">
    <div id="yt-frame"></div>

    <div class="gradient-top"></div>
    <div class="gradient-bottom"></div>

    <div id="controls-overlay">
        <!-- Top -->
        <div class="player-top">
            <button class="back-btn" id="backBtn" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="28" height="28">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <div class="top-right">
                <button title="Audio & Subtitles">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="24" height="24">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M7 15h2m4 0h4M7 11h10"/>
                    </svg>
                </button>
                <button title="Speed" style="font-size:13px;font-weight:700;opacity:.85;letter-spacing:-0.5px;">1×</button>
            </div>
        </div>

        <!-- Bottom -->
        <div class="player-bottom">
            <!-- Progress -->
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-fill" id="progressFill">
                    <div class="progress-dot"></div>
                </div>
            </div>

            <!-- Controls row -->
            <div class="controls-row">
                <div class="ctrl-left">
                    <!-- Play/Pause -->
                    <button class="ctrl-btn play-btn" id="playPauseBtn" title="Play/Pause">
                        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16" rx="1"/>
                            <rect x="14" y="4" width="4" height="16" rx="1"/>
                        </svg>
                        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                            <polygon points="5,3 19,12 5,21"/>
                        </svg>
                    </button>

                    <!-- Skip back 10s -->
                    <button class="ctrl-btn skip-btn" id="skipBackBtn" title="Skip back 10 seconds">
                        <svg viewBox="0 0 36 36" fill="currentColor">
                            <path d="M18 6C11.373 6 6 11.373 6 18s5.373 12 12 12 12-5.373 12-12H28c0 5.523-4.477 10-10 10S8 23.523 8 18 12.477 8 18 8V6z"/>
                            <path d="M16 6l-4-4-4 4h8z"/>
                        </svg>
                        <span class="skip-num">10</span>
                    </button>

                    <!-- Skip forward 10s -->
                    <button class="ctrl-btn skip-btn" id="skipFwdBtn" title="Skip forward 10 seconds">
                        <svg viewBox="0 0 36 36" fill="currentColor">
                            <path d="M18 6c6.627 0 12 5.373 12 12s-5.373 12-12 12S6 23.523 6 18H8c0 5.523 4.477 10 10 10s10-4.477 10-10S23.523 8 18 8V6z"/>
                            <path d="M20 6l4-4 4 4h-8z"/>
                        </svg>
                        <span class="skip-num">10</span>
                    </button>

                    <!-- Volume -->
                    <div class="vol-group">
                        <button class="ctrl-btn vol-btn" id="volBtn" title="Mute/Unmute">
                            <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                                <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06C18.01 19.86 21 16.28 21 12c0-4.28-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="100">
                    </div>

                    <span class="time-label" id="timeLabel">0:00 / 0:00</span>
                </div>

                <!-- Title -->
                <div class="ctrl-center" id="videoTitle"></div>

                <!-- Right -->
                <div class="ctrl-right">
                    <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen">
                        <svg id="fsEnterIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                        <svg id="fsExitIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="player.js"></script>
</body>
</html>
